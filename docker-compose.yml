
services:
  web:
    build: ./app
    image: 426143721074.dkr.ecr.us-east-2.amazonaws.com/workshop2:workshop2_web
    command: gunicorn nc_tutorials.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ./app/.env
    volumes:
      - ./app/:/usr/src/app/
      - static_volume:/usr/src/app/staticfiles
    expose:
      - 8000
    environment:
      - DATABASE=postgres
      - VIRTUAL_HOST=ec2-16-59-1-140.us-east-2.compute.amazonaws.com
      - VIRTUAL_PORT=8000

  nginx:
    build: ./nginx
    image: 426143721074.dkr.ecr.us-east-2.amazonaws.com/workshop2:workshop2_nginx
    volumes:
      - static_volume:/usr/src/app/static
    ports:
      - 8000:80
    depends_on:
      - web

volumes:
  static_volume:
